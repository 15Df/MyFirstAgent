<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, responsive calculator built with vanilla HTML, CSS, and JavaScript.">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <div class="display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="result" id="display" aria-live="polite">0</output>
    </div>

    <div class="keys">
      <button type="button" class="key key--function" data-action="clear">C</button>
      <button type="button" class="key key--function" data-action="backspace" aria-label="Backspace">⌫</button>
      <button type="button" class="key key--function" data-action="percent" aria-label="Percent">%</button>
      <button type="button" class="key key--operator" data-operator="/" aria-label="Divide">÷</button>

      <button type="button" class="key key--number" data-digit="7">7</button>
      <button type="button" class="key key--number" data-digit="8">8</button>
      <button type="button" class="key key--number" data-digit="9">9</button>
      <button type="button" class="key key--operator" data-operator="*" aria-label="Multiply">×</button>

      <button type="button" class="key key--number" data-digit="4">4</button>
      <button type="button" class="key key--number" data-digit="5">5</button>
      <button type="button" class="key key--number" data-digit="6">6</button>
      <button type="button" class="key key--operator" data-operator="-" aria-label="Subtract">−</button>

      <button type="button" class="key key--number" data-digit="1">1</button>
      <button type="button" class="key key--number" data-digit="2">2</button>
      <button type="button" class="key key--number" data-digit="3">3</button>
      <button type="button" class="key key--operator" data-operator="+" aria-label="Add">+</button>

      <button type="button" class="key key--function" data-action="ans" aria-label="Last answer">ANS</button>
      <button type="button" class="key key--number" data-digit="0">0</button>
      <button type="button" class="key key--number" data-digit="." aria-label="Decimal point">.</button>
      <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
